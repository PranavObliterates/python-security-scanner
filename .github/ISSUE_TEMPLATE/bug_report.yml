name: Bug Report / False Positive
description: Report a false positive, missed vulnerability (false negative), or scanner crash.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in PySecure! Please fill out the details below.
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - False Positive (flagged safe code)
        - False Negative (missed real vulnerability)
        - Scanner Crash / Exception
        - Reporting / Output Bug
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Flask
        - Django
        - FastAPI / Starlette
        - General / CLI
    validations:
      required: true
  - type: textarea
    id: reproduction-code
    attributes:
      label: Minimal Reproducible Code Example
      description: Provide the Python code snippet or route handler that triggers the issue.
      placeholder: |
        @app.get("/example")
        def handler(q: str):
            ...
      render: python
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should PySecure have detected or ignored?
    validations:
      required: true
