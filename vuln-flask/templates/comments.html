{% extends "base.html" %}
{% block content %}
<div class="box">
  <h2>[ COMMENTS ]</h2>
  <form method="POST">
    <textarea name="body" rows="3" cols="40" placeholder="Leave a comment..."></textarea><br><br>
    <button type="submit">Post</button>
  </form>
  <hr>
  {% for c in comments %}
  <div style="margin:10px 0; border-bottom: 1px solid #333; padding-bottom:8px;">
    <strong>{{ c.author }}</strong>:
    <!-- ❌ STORED XSS: body rendered as raw HTML -->
    <span>{{ c.body | safe }}</span>
  </div>
  {% endfor %}
</div>
{% endblock %}
