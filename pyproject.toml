[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webvenom"
version = "0.3.0"
description = "OWASP Top 10 SAST + DAST Security Scanner for Python Web Applications with Gemini AI Reporting"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Pranav Shinde" }
]
keywords = [
    "security",
    "sast",
    "dast",
    "owasp",
    "owasp-top-10",
    "vulnerability-scanner",
    "flask",
    "django",
    "fastapi",
    "gemini-ai",
    "security-audit",
    "webvenom",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Flask",
    "Framework :: Django",
    "Framework :: FastAPI",
]
dependencies = [
    "flask>=2.0",
    "markupsafe>=2.0",
    "reportlab>=4.0.0",
    "requests>=2.28.0",
    "google-genai>=0.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
webvenom = "webvenom.cli:main"

[tool.setuptools.packages.find]
include = ["security_scanner*", "webvenom*"]

[tool.setuptools.package-data]
"security_scanner.dynamic" = ["payloads/*.txt"]
